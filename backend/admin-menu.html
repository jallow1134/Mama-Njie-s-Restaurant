<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu Manager - Mama Njie's</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #0B1A2F; /* dark navy background */
        color: #fff;
        margin: 0;
        padding: 20px;
    }
    h1 {
        color: #fff;
        font-size: 24px;
        margin-bottom: 15px;
    }
    .btn {
        background: #FFA500; /* orange buttons */
        color: #000;
        border: none;
        padding: 8px 16px;
        border-radius: 4px;
        font-weight: bold;
        cursor: pointer;
        margin-right: 10px;
        margin-bottom: 15px;
        text-decoration: none;
        display: inline-block;
    }
    .btn:hover { background: #ffbe4d; }
    
    table {
        width: 100%;
        border-collapse: collapse;
        background: #0B1A2F;
        border: 1px solid #1e3a5f;
        border-radius: 8px;
        overflow: hidden;
    }
    th {
        background: #FFA500; /* orange header */
        color: #000;
        padding: 12px;
        text-align: left;
        font-weight: bold;
    }
    td {
        padding: 12px;
        border: 1px solid #1e3a5f;
        color: #fff;
    }
    tr:nth-child(even) {
        background: #112840; /* slight row stripe */
    }
    input {
        background: #1e3a5f;
        color: #fff;
        border: 1px solid #FFA500;
        border-radius: 4px;
        padding: 6px;
        width: 90px;
    }
    .save-btn {
        background: #FFA500;
        color: #000;
        border: none;
        padding: 6px 12px;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
    }
</style>
</head>
<body>
<h1>Menu Manager</h1>

<a href="/admin/download/csv" class="btn">Download CSV</a>
<a href="/admin/download/pdf" class="btn">Download PDF</a>
<p id="menuStatus" role="status" aria-live="polite"></p>

<table id="menuTable">
    <tr><th>Dish</th><th>Category</th><th>Price GMD</th><th>Edit</th></tr>
</table>

<script>
    async function loadMenu() {
        const table = document.getElementById('menuTable');
        const status = document.getElementById('menuStatus');
        try {
            const response = await fetch('/api/menu');
            if (!response.ok) throw new Error('Unable to load menu.');
            const menu = await response.json();
            table.replaceChildren(table.rows[0]);

            menu.forEach(item => {
                const row = table.insertRow();
                row.insertCell().textContent = item.name;
                row.insertCell().textContent = item.category;

                const priceCell = row.insertCell();
                const priceInput = document.createElement('input');
                priceInput.type = 'number';
                priceInput.min = '0';
                priceInput.max = '1000000';
                priceInput.step = '0.01';
                priceInput.value = item.price;
                priceInput.setAttribute('aria-label', `Price for ${item.name}`);
                priceCell.append(priceInput);

                const actionCell = row.insertCell();
                const saveButton = document.createElement('button');
                saveButton.type = 'button';
                saveButton.className = 'save-btn';
                saveButton.textContent = 'Save';
                saveButton.addEventListener('click', () => savePrice(item.id, priceInput, saveButton));
                actionCell.append(saveButton);
            });
        } catch (error) {
            status.textContent = error.message;
        }
    }

    async function savePrice(id, input, button) {
        const price = Number(input.value);
        const status = document.getElementById('menuStatus');
        if (!Number.isFinite(price) || price < 0 || price > 1000000) {
            status.textContent = 'Enter a valid non-negative price.';
            input.focus();
            return;
        }

        button.disabled = true;
        try {
            const response = await fetch('/api/menu/update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id, price })
            });
            const result = await response.json();
            if (!response.ok || !result.success) throw new Error(result.error || 'Unable to save price.');
            status.textContent = `Price saved: GMD ${price.toFixed(2)}`;
        } catch (error) {
            status.textContent = error.message;
        } finally {
            button.disabled = false;
        }
    }

    loadMenu();
</script>
</body>
</html>
