        function getDailyChefSpecial() {
            const now = new Date();
            const localMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const dayIndex = Math.floor(localMidnight.getTime() / 86400000) % chefSpecials.length;
            return { ...chefSpecials[dayIndex], category: 'Chef Specials', isDailySpecial: true };
        }

        const dishes = [getDailyChefSpecial(), ...menuItems];

        function highlightMamaNjie(name) {
            return name.replace(/Mama Njie's/g, '<span class="animated-name">Mama Njie\'s</span>');
        }

        function getDishImage(imageName) {
            const fallback = 'images/jollof.jpg';
            if (!imageName) return fallback;
            const cleaned = imageName.trim().toLowerCase();
            return cleaned.startsWith('images/') ? cleaned : `images/${cleaned}`;
        }

        function renderMenu() {
            const grid = document.getElementById('menu-grid');
            if (!grid) return;

            grid.innerHTML = '';
            const categories = {};

            dishes.forEach(dish => {
                const category = dish.category;
                if (!categories[category]) {
                    categories[category] = [];
                }
                categories[category].push(dish);
            });

            const preferredOrder = ['Chef Specials', 'Main Dishes'];
            const orderedCategories = preferredOrder.filter(cat => categories[cat])
                .concat(Object.keys(categories).filter(cat => !preferredOrder.includes(cat)));

            orderedCategories.forEach(cat => {
                const categoryTitle = cat === 'Chef Specials' ? 'Chef Special of the Day' : cat;
                let columnHTML = `<div class="menu-category"><h3><strong>${categoryTitle}</strong></h3><div class="menu-category-grid">`;

                categories[cat].forEach(dish => {
                    const dishNameHTML = highlightMamaNjie(dish.name);
                    columnHTML += `
                    <div class="menu-item clickable" onclick="goToReservation('${dish.name.replace(/'/g, "\\'")}')">
                        <img src="${getDishImage(dish.image)}" alt="${dish.name}" class="menu-image" loading="lazy" onerror="handleImageError(this)">
                        <div>
                            <div class="item-header">${dishNameHTML}<span class="price">${dish.price} GMD</span></div>
                            <p>${dish.description}</p>
                            <span class="order-btn">Reserve This Dish →</span>
                        </div>
                    </div>
                    `;
                });

                columnHTML += `</div></div>`;
                grid.innerHTML += columnHTML;
            });
        }

        function goToReservation(dishName) {
            window.location.href = 'reservation.html?dish=' + encodeURIComponent(dishName);
        }

        function handleImageError(img) {
            img.onerror = null;
            img.src = 'images/jollof.jpg';
            img.classList.add('image-error');
            img.alt = `${img.alt} - Image unavailable`;
        }

        document.addEventListener('DOMContentLoaded', renderMenu);
    </script>
    <script src="js/script.js"></script>
</body>
