<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu Manager - Mama Njie's</title>

<button class="btn">Download CSV</button>
<button class="btn">Download PDF</button>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #0B1A2F; /* dark navy background */
        color: #fff;
        margin: 0;
        padding: 20px;
    }
    h1 {
        color: #fff;
        font-size: 24px;
        margin-bottom: 15px;
    }
    .btn {
        background: #FFA500; /* orange buttons */
        color: #000;
        border: none;
        padding: 8px 16px;
        border-radius: 4px;
        font-weight: bold;
        cursor: pointer;
        margin-right: 10px;
        margin-bottom: 15px;
    }
    .btn:hover { background: #ffbe4d; }
    
    table {
        width: 100%;
        border-collapse: collapse;
        background: #0B1A2F;
        border: 1px solid #1e3a5f;
        border-radius: 8px;
        overflow: hidden;
    }
    th {
        background: #FFA500; /* orange header */
        color: #000;
        padding: 12px;
        text-align: left;
        font-weight: bold;
    }
    td {
        padding: 12px;
        border: 1px solid #1e3a5f;
        color: #fff;
    }
    tr:nth-child(even) {
        background: #112840; /* slight row stripe */
    }
    input {
        background: #1e3a5f;
        color: #fff;
        border: 1px solid #FFA500;
        border-radius: 4px;
        padding: 6px;
        width: 90px;
    }
    .save-btn {
        background: #FFA500;
        color: #000;
        border: none;
        padding: 6px 12px;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
    }
</style>
</head>
<body>
<h1>Menu Manager</h1>
<table id="menuTable">
    <tr><th>Dish</th><th>Category</th><th>Price GMD</th><th>Edit</th></tr>
</table>

<script>
    async function loadMenu() {
    const res = await fetch('/api/menu');
    const menu = await res.json();
    const table = document.getElementById('menuTable');
    menu.forEach(item => {
        table.innerHTML += `
        <tr>
            <td>${item.name}</td>
            <td>${item.category}</td>
            <td><input type="number" id="price${item.id}" value="${item.price}" step="0.01"></td>
            <td><button onclick="savePrice(${item.id})">Save</button></td>
        </tr>`
    });
    }
    
    async function savePrice(id) {
    const newPrice = document.getElementById(`price${id}`).value;
    await fetch(`/api/menu/${id}`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ price: newPrice })
    });
    alert('Price updated!');
    }
    
    loadMenu();
    const urlParams = new URLSearchParams(window.location.search);
const key = urlParams.get('key');
if(key !== '5169685') {
document.body.innerHTML = '<h1>Access Denied</h1>';
throw new Error('Wrong key');
}
</script>
</body>
</html>
