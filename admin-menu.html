<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu Manager - Mama Njie's</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #0B1A2F; /* dark navy background */
        color: #fff;
        margin: 0;
        padding: 20px;
    }
    h1 {
        color: #fff;
        font-size: 24px;
        margin-bottom: 15px;
    }
    .btn {
        background: #FFA500; /* orange buttons */
        color: #000;
        border: none;
        padding: 8px 16px;
        border-radius: 4px;
        font-weight: bold;
        cursor: pointer;
        margin-right: 10px;
        margin-bottom: 15px;
        text-decoration: none;
        display: inline-block;
    }
    .btn:hover { background: #ffbe4d; }
    
    table {
        width: 100%;
        border-collapse: collapse;
        background: #0B1A2F;
        border: 1px solid #1e3a5f;
        border-radius: 8px;
        overflow: hidden;
    }
    th {
        background: #FFA500; /* orange header */
        color: #000;
        padding: 12px;
        text-align: left;
        font-weight: bold;
    }
    td {
        padding: 12px;
        border: 1px solid #1e3a5f;
        color: #fff;
    }
    tr:nth-child(even) {
        background: #112840; /* slight row stripe */
    }
    input {
        background: #1e3a5f;
        color: #fff;
        border: 1px solid #FFA500;
        border-radius: 4px;
        padding: 6px;
        width: 90px;
    }
    .save-btn {
        background: #FFA500;
        color: #000;
        border: none;
        padding: 6px 12px;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
    }
</style>
</head>
<body>
<h1>Menu Manager</h1>

<a href="/admin/download/csv?key=5169685" class="btn">Download CSV</a>
<a href="/admin/download/pdf?key=5169685" class="btn">Download PDF</a>

<table id="menuTable">
    <tr><th>Dish</th><th>Category</th><th>Price GMD</th><th>Edit</th></tr>
</table>

<script>
    // IMPORTANT: CHANGE THESE TO MATCH YOUR RENDER .env
    const ADMIN_USER = 'admin';
    const ADMIN_PASS = 'password';

    async function loadMenu() {
    const res = await fetch('/api/menu');
    const menu = await res.json();
    const table = document.getElementById('menuTable');
    menu.forEach(item => {
        table.innerHTML += `
        <tr>
            <td>${item.name}</td>
            <td>${item.category}</td>
            <td><input type="number" id="price${item.id}" value="${item.price}" step="0.01"></td>
            <td><button class="save-btn" onclick="savePrice(${item.id})">Save</button></td>
        </tr>`
    });
    }
    
    async function savePrice(id) {
    const newPrice = document.getElementById(`price${id}`).value;
    const res = await fetch(`/api/menu/update`, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Basic ' + btoa(ADMIN_USER + ':' + ADMIN_PASS)
        },
        body: JSON.stringify({ id: id, price: parseFloat(newPrice) })
    });
    const data = await res.json();
    if(data.success) alert('Price updated to GMD ' + newPrice);
    else alert('Error: ' + data.error);
    }
    
    loadMenu();
</script>
</body>
</html>
