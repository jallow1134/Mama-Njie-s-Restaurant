<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found</title>
  <style>
    body { font-family: Arial, sans-serif; background: #243a52; color: #fff; margin: 0; display: grid; place-items: center; min-height: 100vh; text-align: center; }
    .box { background: #0f2438; padding: 2rem; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.3); }

  </style>
</head>
<body>
  <div class="box">
    <h1>404 - Page Not Found</h1>

  </div>

</html>
